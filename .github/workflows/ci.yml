name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PRs: one group per PR, so a new push cancels the superseded run. Pushes to main: one group
  # per commit (GitHub would otherwise replace a still-pending run in the same group), so every
  # merged commit gets its own full result.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vertice
          POSTGRES_USER: vertice
          POSTGRES_PASSWORD: vertice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vertice -d vertice"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Full history, so the base branch is available locally for `buf breaking`.
          fetch-depth: 0

      # The protos under src/main/proto are the contract vertice-bff copies (see README, "Proto
      # contract"). Lint and breaking-change checks run here, inside the required check, so an
      # incompatible change can't be merged. Config: buf.yaml.
      - name: Set up Buf
        uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: 1.73.0
          setup_only: true

      - name: Lint protos
        run: buf lint

      - name: Check protos for breaking changes
        if: github.event_name == 'pull_request'
        # subdir: compare the proto tree itself, so the check doesn't depend on the base branch
        # having a buf.yaml.
        run: buf breaking --against ".git#ref=refs/remotes/origin/${{ github.base_ref }},subdir=src/main/proto"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build and test
        run: ./gradlew build

  dependency-scan:
    # Grype scans the Spring Boot fat jar, i.e. exactly the runtime classpath that ships (no test or
    # developmentOnly dependencies), and fails on any high or critical advisory. GitHub's
    # dependency-review-action isn't usable: the dependency graph is disabled for this repo.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build the boot jar
        run: ./gradlew bootJar

      - name: Scan runtime dependencies
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          path: build/libs
          grype-version: v0.120.1
          severity-cutoff: high
          output-format: table
