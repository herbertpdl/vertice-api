# Deployed on AWS against Aurora PostgreSQL (express configuration), which accepts IAM authentication
# only: no password exists. The AWS Advanced JDBC Wrapper's `iam` plugin signs a short-lived token
# for every new connection with the task role's credentials. Set SPRING_DATASOURCE_URL to
# jdbc:aws-wrapper:postgresql://<cluster endpoint>:5432/vertice?sslmode=require and DB_USERNAME to a
# database role granted rds_iam. These keys live here rather than in environment variables because
# Spring lowercases map keys bound from the environment and the wrapper's property names are
# case-sensitive.
spring.datasource.driver-class-name=software.amazon.jdbc.Driver
spring.datasource.hikari.data-source-properties.wrapperPlugins=iam
spring.datasource.hikari.data-source-properties.iamRegion=us-east-2
# A token is checked only when a connection opens and expires after 15 minutes; recycle before that.
spring.datasource.hikari.max-lifetime=840000
# Aurora Serverless v2 can be auto-paused at 0 ACU, and resuming takes several seconds.
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.exception-override-class-name=software.amazon.jdbc.util.HikariCPSQLException
