spring.application.name=vertice-api

# Server
server.port=8080

# gRPC
spring.grpc.server.port=9090
spring.grpc.server.reflection.enabled=false

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/vertice
spring.datasource.username=${DB_USERNAME:vertice}
spring.datasource.password=${DB_PASSWORD:vertice}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Security - JWT: HS256 tokens minted by vertice-bff, verified with the same shared secret on both
# sides. Outside the local profile the secret must be at least 32 bytes (see JwtSecretGuard).
vertice.jwt.secret=${JWT_SECRET:dev-secret-change-me}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
