spring.application.name=vertice-api

# Server
server.port=8080

# gRPC
spring.grpc.server.port=9090
spring.grpc.server.reflection.enabled=false

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/vertice
spring.datasource.username=${DB_USERNAME:vertice}
spring.datasource.password=${DB_PASSWORD:vertice}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Security - JWT (set JWT_ISSUER_URI in env to match your auth server)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://localhost:9000}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
