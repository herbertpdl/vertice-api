syntax = "proto3";

package vertice.student.v1;

import "google/protobuf/empty.proto";

option java_package = "com.vertice.api.generated.grpc.student.v1";
option java_multiple_files = true;

service StudentService {
  rpc ListStudents(ListStudentsRequest) returns (ListStudentsResponse);
  rpc GetStudent(GetStudentRequest) returns (StudentResponse);
  rpc CreateStudent(StudentCreateRequest) returns (StudentResponse);
  rpc UpdateStudent(UpdateStudentRequest) returns (StudentResponse);
  rpc DeleteStudent(DeleteStudentRequest) returns (google.protobuf.Empty);
  rpc SetStudentPassword(SetStudentPasswordRequest) returns (google.protobuf.Empty);
}

message StudentResponse {
  int64 id = 1;
  string name = 2;
  string email = 3;
  string cpf = 4;
}

message StudentRequest {
  string name = 1;
  string email = 2;
  string cpf = 3;
}

message StudentCreateRequest {
  string name = 1;
  string email = 2;
  string password = 3;
  string cpf = 4;
}

message ListStudentsRequest {
}

message ListStudentsResponse {
  repeated StudentResponse students = 1;
}

message GetStudentRequest {
  int64 id = 1;
}

message UpdateStudentRequest {
  int64 id = 1;
  StudentRequest student = 2;
}

message DeleteStudentRequest {
  int64 id = 1;
}

message SetStudentPasswordRequest {
  int64 id = 1;
  string password = 2;
}
