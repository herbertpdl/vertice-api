services:
  postgres:
    image: postgres:16
    container_name: vertice-postgres
    environment:
      POSTGRES_DB: vertice
      POSTGRES_USER: vertice
      POSTGRES_PASSWORD: vertice
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vertice -d vertice"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
