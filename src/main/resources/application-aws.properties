# Deployed on AWS against Aurora PostgreSQL (express configuration), which accepts IAM authentication
# only: no password exists. The AWS Advanced JDBC Wrapper's `iam` plugin signs a short-lived token
# for every new connection with the task role's credentials. Set SPRING_DATASOURCE_URL to
# jdbc:aws-wrapper:postgresql://<cluster endpoint>:5432/vertice, without an sslmode parameter (pgjdbc
# lets the URL override the properties below), and DB_USERNAME to a database role granted rds_iam.
# These keys live here rather than in environment variables because Spring lowercases map keys bound
# from the environment and the wrapper's property names are case-sensitive.
spring.datasource.driver-class-name=software.amazon.jdbc.Driver
spring.datasource.hikari.data-source-properties.wrapperPlugins=iam
spring.datasource.hikari.data-source-properties.iamRegion=us-east-2
# The cluster is reached over the internet access gateway, and the IAM token travels as the password:
# verify the server's certificate and host name. The gateway presents a public Amazon Trust Services
# certificate (Amazon Root CA 1), not one from the RDS CA bundle, so pgjdbc checks it against the
# JVM's default trust store instead of a bundled root.
spring.datasource.hikari.data-source-properties.sslmode=verify-full
spring.datasource.hikari.data-source-properties.sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory
# Aurora Serverless v2 can be auto-paused at 0 ACU, and resuming takes several seconds.
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.exception-override-class-name=software.amazon.jdbc.util.HikariCPSQLException

# The container health check uses /actuator/health/liveness, which leaves the database out: a
# database blip must not make ECS replace every task at once. /actuator/health still reports it.
management.endpoint.health.probes.enabled=true
