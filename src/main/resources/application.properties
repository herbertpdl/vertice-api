spring.application.name=vertice-api

# Server
server.port=8080

# gRPC
spring.grpc.server.port=9090
spring.grpc.server.reflection.enabled=false

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/vertice
spring.datasource.username=${DB_USERNAME:vertice}
spring.datasource.password=${DB_PASSWORD:vertice}
spring.datasource.driver-class-name=org.postgresql.Driver
# pgjdbc otherwise appends the server's "Detail: Key (cpf)=(...)" to every error message, which puts
# the offending email or CPF into exceptions and logs. The constraint name stays in the message.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Hibernate logs every SQL error's text at WARN before rethrowing it, and Postgres error text can
# carry input values. GrpcExceptionAdvice logs integrity violations itself (SQLSTATE and constraint
# name only), so this second copy is switched off.
logging.level.org.hibernate.orm.jdbc.error=OFF

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Security - JWT: HS256 tokens minted by vertice-bff, verified with the same shared secret on both
# sides. The default is the shared local-dev value (same as vertice-bff's); outside the local profile
# JwtSecretGuard refuses it, as well as any blank, padded, sub-32-byte or other placeholder secret.
vertice.jwt.secret=${JWT_SECRET:vertice-dev-jwt-secret-do-not-use-in-production}

# Password setup tokens (first-access links for users created without a password)
vertice.password-setup.token-ttl=${PASSWORD_SETUP_TOKEN_TTL:72h}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
