plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.google.protobuf' version '0.10.0'
}

group = 'com.vertice'
version = '0.0.1-SNAPSHOT'
description = 'Vertice Coach API'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

ext {
	mapstructVersion = '1.6.3'
	// Patch overrides of Boot-managed versions for high/critical advisories still open in Boot 4.1.1
	// (Tomcat < 11.0.25, Jackson 3 < 3.1.7). Drop each once a Boot release manages that version or newer.
	set('tomcat.version', '11.0.27')
	set('jackson-bom.version', '3.1.7')
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-grpc-server'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	compileOnly 'org.projectlombok:lombok'
	implementation "org.mapstruct:mapstruct:${mapstructVersion}"
	runtimeOnly 'org.postgresql:postgresql'
	// IAM database authentication for the deployed Aurora cluster (`aws` profile); unused otherwise
	runtimeOnly 'software.amazon.jdbc:aws-advanced-jdbc-wrapper:4.5.0'
	runtimeOnly 'software.amazon.awssdk:rds:2.57.5'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-grpc-server-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testAnnotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
	constraints {
		// Not Boot-managed: grpc-java 1.83.1 brings 33.6.0 (GHSA-xxph-c9ww-hj94, high). Drop once
		// the gRPC starter's grpc-java depends on 33.7.2 or newer.
		implementation('com.google.guava:guava:33.7.2-jre') {
			because 'GHSA-xxph-c9ww-hj94'
		}
	}
}

protobuf {
	plugins {
		grpc {}
	}
}

// The time-zone contract (P2-02) must not depend on the host's zone, so the test that states it
// runs twice: once in the ordinary `test` task (whatever zone the machine or CI runner is in, which
// is UTC on GitHub's) and once here with the JVM pinned 14 hours away from the business zone, on the
// far side of the date line. pgjdbc hands the JVM's zone to the database session, so this covers
// the DB side too. `check` depends on it, so `./gradlew build` runs both.
def hostileTimeZone = 'Pacific/Kiritimati'
tasks.register('hostileTimeZoneTest', Test) {
	description = "Runs the time-zone contract test with the JVM pinned to ${hostileTimeZone} (UTC+14)."
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	filter {
		includeTestsMatching 'com.vertice.api.common.time.BusinessTimeZoneIntegrationTest'
		// V31's `USING col AT TIME ZONE 'UTC'` is only provably session-zone-independent when the
		// migration is rehearsed from a session that isn't in UTC.
		includeTestsMatching 'com.vertice.api.common.time.InstantColumnsTimestamptzMigrationTest'
	}
	systemProperty 'user.timezone', hostileTimeZone
	// Asserted by the test itself, so this task can't silently stop pinning the zone.
	systemProperty 'vertice.test.expectedTimeZone', hostileTimeZone
	environment 'TZ', hostileTimeZone

	// The in-test check is @EnabledIfSystemProperty, so dropping the properties above would skip it
	// rather than fail, quietly turning this task into a second copy of `test`. Check the wiring here
	// too, where it can't be skipped.
	doFirst {
		['user.timezone', 'vertice.test.expectedTimeZone'].each { key ->
			if (systemProperties[key] != hostileTimeZone) {
				throw new GradleException("hostileTimeZoneTest must set -D${key}=${hostileTimeZone} " +
						"(found: ${systemProperties[key]}); without it this task proves nothing.")
			}
		}
	}
}

tasks.named('check') {
	dependsOn 'hostileTimeZoneTest'
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	// Keep the developer's shell out of the test JVM: an exported VERTICE_ENV would make
	// LocalProfileGuard refuse every @ActiveProfiles("local") context, and an exported JWT_SECRET
	// would stop tokens minted with TestJwts.LOCAL_SECRET from verifying. Tests that need either
	// value set it explicitly.
	environment.remove('VERTICE_ENV')
	environment.remove('JWT_SECRET')
}
